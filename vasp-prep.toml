# VASP 前处理工具配置
# 改完直接重启网页/终端即可生效；不需要改任何 .py 文件。
# 优先级：环境变量 > 本文件 > 代码默认值
#   环境变量：VASP_PREP_LLM_BASE / VASP_PREP_LLM_MODEL / VASP_PREP_PORT

[paths]
# 打开网页时预填的源目录（留空则每次自己填）
default_source = ""
# 单文件输出目录（相对仓库根；网页上只填 runs 下的文件夹名）
default_output = "runs"
# 批量输出、数据库下载、手动导入、检索缓存各自放在哪
# 想放到 D 盘就写绝对路径，例如 materials_dir = "D:/vasp_models/downloaded"
batches_dir = "batches"
materials_dir = "materials"
imports_dir = "imports"
cache_dir = "cache"

[batch]
# 一次批量最多处理多少个材料目录（防止误选整块盘把机器跑死）
max_materials = 200
# 一次批量最多生成多少项（材料 × 参数）
max_dirs = 500
# 0 = 只在根目录下一层找材料；1 = 再往下一层找
recursive_depth = 0

[db]
# 数据库请求超时（秒）；OQMD 较慢，别低于 20
timeout = 30
# C2DB 可选 API key：只从环境变量读，别把 key 写进仓库
c2db_api_key_env = "C2DB_API_KEY"
mp_optimade = "https://optimade.materialsproject.org/v1"
oqmd_optimade = "https://oqmd.org/optimade/v1"
aflow_aflux = "https://aflow.org/API/aflux/"
twodmatpedia_db = "http://www.2dmatpedia.org/static/db.json.gz"

[llm]
# 是否启用模型。false = 只用规则模式（不联网、不探测）
enabled = true
# 本地 Ollama 的 OpenAI 兼容地址；换成 vLLM/llama.cpp server 也只改这里
base_url = "http://127.0.0.1:11434/v1"
model = "qwen2.5-coder:7b"
# 本地模型随便填一个非空值；云端服务填真 key
api_key = "ollama"
timeout = 120
# 隐私档位：
#   strict = 只发"中文指令 + 原子数/元素/晶格取整"，不发坐标、不发文件内容（默认）
#   normal = 额外发 INCAR 键名列表（仍不发值、不发坐标）
#   off    = 不调用模型，强制规则模式
privacy = "strict"

[ui]
host = "127.0.0.1"
port = 8765
# 启动后自动打开浏览器
auto_open = true
